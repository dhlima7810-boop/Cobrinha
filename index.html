<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Ouroboros</title>
<style>
  /* Paleta mineral: verde quase preto, traço em osso, um só acento em ouro
     velho. Nada de neon — a cara é de vitrine, não de fliperama. */
  :root {
    --fundo: #0a0f0c;
    --osso: #e4e0d2;
    --osso-fraco: #8e9185;
    --ouro: #c9a227;
    --ouro-fraco: #6d5f33;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: var(--fundo); touch-action: none; }
  body { font: 400 16px/1.5 Georgia, 'Iowan Old Style', 'Times New Roman', serif;
         color: var(--osso); user-select: none; -webkit-font-smoothing: antialiased; }
  canvas { display: block; }

  /* ---------- placar ---------- */
  .hud[hidden] { display: none; }
  .hud { position: fixed; inset: 16px 20px auto; display: flex; justify-content: space-between;
         align-items: flex-start; gap: 12px; pointer-events: none; }
  .hud__dir { text-align: right; }
  .hud__meio { display: grid; justify-items: center; gap: 10px; }
  .rotulo { display: block; font-size: 11px; letter-spacing: .22em; text-transform: uppercase;
            color: var(--osso-fraco); }
  .numero { display: block; font-size: 30px; line-height: 1.1; color: var(--osso);
            font-variant-numeric: tabular-nums; }
  .miudo { display: block; font-size: 12px; color: var(--osso-fraco); font-style: italic; }

  /* O aro é o placar: fecha quando a meta chega. */
  .aro { position: relative; width: 76px; height: 76px; display: grid; place-items: center; }
  .aro svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .aro circle { fill: none; stroke-width: 3; }
  .aro__trilho { stroke: #262c23; }
  .aro__fio { stroke: var(--ouro-fraco); stroke-linecap: round;
              stroke-dasharray: 276.46; stroke-dashoffset: 276.46; transition: stroke .6s; }
  .aro--fechado .aro__fio { stroke: var(--ouro); }
  .aro .numero { font-size: 26px; }

  /* ---------- botões: gravados, não pílulas ---------- */
  .icone { pointer-events: auto; width: 34px; height: 34px; border: 0; border-radius: 999px;
           background: transparent; color: var(--osso-fraco); font-size: 14px; cursor: pointer;
           transition: color .25s; }
  .icone:hover, .icone:focus-visible { color: var(--ouro); outline: none; }
  .icone[hidden] { display: none; }

  .poder { padding: 4px 14px; border-bottom: 1px solid var(--ouro-fraco); color: var(--ouro);
           font-size: 12px; font-style: italic; white-space: nowrap; }
  .poder[hidden] { display: none; }

  .aviso { position: fixed; inset: 118px 12px auto; text-align: center; color: var(--ouro);
           font-style: italic; letter-spacing: .02em; pointer-events: none;
           text-shadow: 0 2px 14px rgba(0,0,0,.8); }
  .aviso[hidden] { display: none; }

  /* ---------- painéis ---------- */
  .painel { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center;
            text-align: center; gap: 12px; padding: 28px 20px; overflow: auto;
            background: radial-gradient(closest-side, rgba(10,15,12,.9), rgba(10,15,12,.5)); }
  .painel--entrada { background: radial-gradient(closest-side, rgba(6,10,7,.9), rgba(6,10,7,.5)); }
  .painel[hidden] { display: none; }
  /* O nome é peça de metal, não texto: gradiente de ouro escovado, relevo
     empilhado em sombras e um leve recuo em perspectiva. */
  h1 { font: 900 clamp(44px, 12vw, 136px)/.86 'Arial Black', 'Helvetica Neue', Impact, system-ui, sans-serif;
       letter-spacing: -.02em; text-transform: uppercase; margin-bottom: 14px;
       background: linear-gradient(176deg,
         #fffdf4 0%, #efe6cb 22%, #d9bf63 42%, #c9a227 52%,
         #7d6213 60%, #e6d79c 74%, #fffdf4 100%);
       -webkit-background-clip: text; background-clip: text; color: transparent;
       transform: perspective(760px)
                  rotateX(calc(17deg + var(--my, 0) * -8deg))
                  rotateY(calc(var(--mx, 0) * 10deg))
                  translateZ(calc(var(--carga) * -260px))
                  scale(1.04);
       transition: transform .55s cubic-bezier(.22, 1, .36, 1);
       filter:
         drop-shadow(0 1px 0 #6d5f33) drop-shadow(0 2px 0 #5b4f2a)
         drop-shadow(0 3px 0 #4a4022) drop-shadow(0 4px 0 #3a321a)
         drop-shadow(0 5px 0 #2b2513) drop-shadow(0 6px 0 #1d190d)
         drop-shadow(0 18px 26px rgba(0,0,0,.85)); }
  h1 + p { letter-spacing: .14em; text-transform: uppercase; font-style: normal;
           font-size: 12px; color: var(--osso-fraco); }
  h2 { font-size: clamp(22px, 4.5vw, 34px); font-weight: 400; letter-spacing: .18em;
       text-transform: uppercase; color: var(--osso); }
  .painel p { color: var(--osso-fraco); font-style: italic; max-width: 34ch; }
  .painel p[hidden] { display: none; }

  .grupo { display: grid; gap: 2px; justify-items: stretch; margin-top: 10px; min-width: 260px; }
  .grupo[hidden] { display: none; }

  .botao { width: 100%; padding: 13px 20px; border: 0; border-bottom: 1px solid #262c23;
           background: transparent; color: var(--osso); font: inherit; font-size: 15px;
           letter-spacing: .18em; text-transform: uppercase; cursor: pointer;
           transition: color .25s, border-color .25s, letter-spacing .25s; }
  .botao:hover, .botao:focus-visible { color: var(--ouro); border-color: var(--ouro-fraco);
                                       letter-spacing: .24em; outline: none; }
  .botao[hidden] { display: none; }
  .botao { -webkit-touch-callout: none; }

  /* Carregando, o menu recua e só o botão segurado fica: o que sai de cena é o
     menu, não o jogo — ele já está acontecendo atrás. */
  .painel--carga { background: radial-gradient(closest-side,
                     rgba(10,15,12, calc(.9 - var(--carga) * .9)),
                     rgba(10,15,12, calc(.5 - var(--carga) * .5))); }
  .painel--carga > .brasao, .painel--carga > p,
  .painel--carga #principal > .botao:not(#jogar) { opacity: max(0, calc(1 - var(--carga) * 1.7)); }

  /* ---------- o nome responde ao ponteiro ---------- */
  /* --mx/--my vêm do JS, de -1 a 1. O nome é uma peça de metal pendurada: o
     ponteiro vira a peça, e com a carga ela recua no fundo junto com a câmera. */
  .brasao { animation: balanco 9s ease-in-out infinite; transform-style: preserve-3d; }
  @keyframes balanco {
    0%, 100% { transform: translateY(0) rotate(-.25deg); }
    50%      { transform: translateY(-5px) rotate(.25deg); }
  }
  @media (prefers-reduced-motion: reduce) { .brasao { animation: none; } }

  /* ---------- segurar para entrar ---------- */
  /* A barra do Jogar e a entrada da cobra são o MESMO valor: `--carga`, escrito
     pelo laço no painel. Por isso a barra nunca mente sobre onde ela está. */
  .painel { --carga: 0; }
  #jogar { position: relative; overflow: hidden; isolation: isolate;
           letter-spacing: calc(.18em + var(--carga) * .2em);
           color: var(--osso);                      /* reserva: navegador sem color-mix */
           color: color-mix(in srgb, var(--osso), var(--ouro) calc(var(--carga) * 100%));
           box-shadow: 0 0 calc(var(--carga) * 30px) rgba(201,162,39, calc(var(--carga) * .45));
           border-color: color-mix(in srgb, #262c23, var(--ouro) calc(var(--carga) * 100%)); }
  /* o que enche o botão é A PELE QUE VOCÊ VESTE, a mesma que entra no
     tabuleiro: o botão não é uma barra de carga, é ela chegando */
  #jogar::before { content: ''; position: absolute; inset: 0; z-index: -1;
                   width: calc(var(--carga) * 100%);
                   background-image: var(--pele); background-size: auto 230%;
                   background-position: left center; opacity: .55; }
  /* e o fio de ouro corre do meio para as duas pontas, fechando sobre si */
  #jogar::after { content: ''; position: absolute; left: 50%; bottom: 0; height: 2px;
                  width: calc(var(--carga) * 100%); transform: translateX(-50%);
                  background: linear-gradient(90deg, transparent,
                              var(--ouro) 16%, #fff6cf 50%, var(--ouro) 84%, transparent); }
  /* parado, o botão respira: é o convite para segurar */
  .painel:not(.painel--carga) #jogar { animation: respira 3.6s ease-in-out infinite; }
  @keyframes respira {
    0%, 100% { box-shadow: 0 0 0 rgba(201,162,39,0); }
    50%      { box-shadow: 0 0 16px rgba(201,162,39,.2); }
  }
  @media (prefers-reduced-motion: reduce) { .painel #jogar { animation: none; } }
  .botao--fraco { color: var(--osso-fraco); font-size: 13px; }
  .botao--ouro { color: var(--ouro); border-color: var(--ouro-fraco); }

  /* ---------- vestiário ---------- */
  .vitrine { display: grid; gap: 10px; width: min(92vw, 680px); max-height: 56vh; overflow: auto;
             grid-template-columns: repeat(auto-fill, minmax(124px, 1fr)); padding: 2px; }
  .cobra { display: grid; gap: 4px; padding: 0 0 8px; border: 1px solid #262c23; background: transparent;
           color: var(--osso); font: inherit; cursor: pointer; text-align: center;
           transition: border-color .25s, color .25s; }
  .cobra:hover, .cobra:focus-visible { border-color: var(--ouro-fraco); outline: none; }
  .cobra__pele { height: 58px; background-size: 150% auto; background-position: center;
                 filter: saturate(1.05); }
  .cobra__nome { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; }
  .cobra__como { font-size: 11px; font-style: italic; color: var(--osso-fraco); padding: 0 6px; }
  .cobra--presa { color: var(--osso-fraco); }
  .cobra--presa .cobra__pele { filter: grayscale(1) brightness(.4); }
  .cobra--presa { cursor: not-allowed; }
  .cobra--vestida { border-color: var(--ouro); }
  .cobra--vestida .cobra__nome { color: var(--ouro); }

  @media (max-height: 560px) { h1 { font-size: clamp(24px, 6vw, 38px); } .botao { padding: 10px 16px; } }
</style>
</head>
<body>
<div class="hud" id="hud">
  <div>
    <div class="aro" id="aro">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="aro__trilho" cx="50" cy="50" r="44"/>
        <circle class="aro__fio" id="aroFio" cx="50" cy="50" r="44"/>
      </svg>
      <b class="numero" id="pts">0</b>
    </div>
    <small class="miudo" id="meta"></small>
  </div>
  <div class="hud__meio">
    <button class="icone" id="pausa" title="Pausar" aria-label="Pausar" hidden>&#9208;</button>
    <div class="poder" id="poder" hidden></div>
  </div>
  <div class="hud__dir">
    <span class="rotulo">Recorde</span><b class="numero" id="rec">0</b>
    <small class="miudo" id="saldo"></small>
  </div>
</div>

<div class="aviso" id="aviso" hidden></div>

<div class="painel" id="painel">
  <div class="brasao"><h1 id="titulo">Ouroboros</h1></div>
  <p id="sub">Segure JOGAR para entrar</p>

  <div class="grupo" id="principal">
    <button class="botao botao--ouro" id="revToken" hidden></button>
    <button class="botao botao--ouro" id="revBanco" hidden></button>
    <button class="botao" id="jogar">Jogar</button>
    <button class="botao botao--fraco" id="abrirNiveis">Dificuldade</button>
    <button class="botao botao--fraco" id="abrirVest">Vestiário</button>
    <button class="botao botao--fraco" id="menuConfig">Configurações</button>
  </div>

  <div class="grupo" id="acoes" hidden>
    <button class="botao" id="continuar">Continuar</button>
    <button class="botao botao--fraco" id="abrirConfig">Configurações</button>
    <button class="botao botao--fraco" id="sair">Sair para o menu</button>
  </div>

  <p id="dica">Setas ou WASD · deslize no celular · P pausa</p>
</div>

<div class="painel" id="pniveis" hidden>
  <h2>Dificuldade</h2>
  <p id="subNiveis">A meta muda, e com ela a velocidade e os obstáculos</p>
  <div class="grupo">
    <button class="botao" data-nivel="facil">Fácil · meta 15</button>
    <button class="botao" data-nivel="medio">Médio · meta 25</button>
    <button class="botao" data-nivel="dificil">Difícil · meta 40</button>
    <button class="botao botao--fraco" id="voltarNiveis">Voltar</button>
  </div>
</div>

<div class="painel" id="pvest" hidden>
  <h2>Vestiário</h2>
  <p id="subVest">As cobras vêm dos pontos somados na vida; as últimas, de desafios</p>
  <div class="vitrine" id="vitrine"></div>
  <button class="botao botao--fraco" id="fecharVest">Voltar</button>
</div>

<div class="painel" id="pconfig" hidden>
  <h2>Configurações</h2>
  <div class="grupo">
    <button class="botao botao--fraco" id="tSom">Som</button>
    <button class="botao botao--fraco" id="tAba">Pausar ao sair da aba</button>
    <button class="botao" id="fecharConfig">Voltar</button>
  </div>
</div>

<script src="jogo.js"></script>
</body>
</html>
